services:
  mongo:
    image: mongo:7
    container_name: clm-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: clm

  redis:
    image: redis:7-alpine
    container_name: clm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio
    container_name: clm-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
      - minio
    environment:
      - MONGO_URI=mongodb://mongo:27017/clm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clm-worker
    restart: unless-stopped
    command: ["node", "src/jobs/workers/index.js"]
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
      - minio
    environment:
      - MONGO_URI=mongodb://mongo:27017/clm
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clm-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  redis-data:
  minio-data:
